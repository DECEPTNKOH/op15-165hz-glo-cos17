name: Build and Release Module

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint shell scripts
        run: |
          sh -n customize.sh post-fs-data.sh service.sh uninstall.sh
          shellcheck post-fs-data.sh service.sh uninstall.sh
          shellcheck -s sh -e SC2154,SC2034 customize.sh

      - name: Read and validate module metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          PROP_VER=$(grep '^version=' module.prop | cut -d'=' -f2 | tr -d '\r')
          VERSION_CODE=$(grep '^versionCode=' module.prop | cut -d'=' -f2 | tr -d '\r')
          if [ "$TAG" != "$PROP_VER" ]; then
            echo "ERROR: Tag ($TAG) does not match module.prop version ($PROP_VER)"
            exit 1
          fi
          ZIP_NAME="OP15_165Hz_GLO_COS17_${TAG}.zip"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes for current version
        run: |
          awk -v ver="## ${{ steps.meta.outputs.version }}" '
            $0 == ver { flag=1; next }
            /^## / && flag { exit }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${{ steps.meta.outputs.version }}" > release_notes.md
          fi

      - name: Build module ZIP and SHA-256
        run: |
          ZIP="${{ steps.meta.outputs.zip_name }}"
          zip -r9 "$ZIP" . \
            -x ".git/*" ".github/*" "docs/*" ".gitignore" "README.md" "CHANGELOG.md" "update.json" "release_notes.md" "patched/*" "orig_settings.env" "*.log" "*.zip" "*.sha256"
          sha256sum "$ZIP" > "${ZIP}.sha256"
          printf '\n### SHA-256\n\n    %s\n' "$(cat "${ZIP}.sha256")" >> release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP="${{ steps.meta.outputs.zip_name }}"
          gh release create "${{ steps.meta.outputs.version }}" "$ZIP" "${ZIP}.sha256" \
            --title "${{ steps.meta.outputs.version }} — OnePlus 15 GLO 165Hz Unlock" \
            --notes-file release_notes.md

      - name: Update update.json on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          printf '{\n  "version": "%s",\n  "versionCode": %s,\n  "zipUrl": "[https://github.com/%s/releases/download/%s/%s](https://github.com/%s/releases/download/%s/%s)",\n  "changelog": "[https://raw.githubusercontent.com/%s/main/CHANGELOG.md](https://raw.githubusercontent.com/%s/main/CHANGELOG.md)"\n}\n' \
            "${{ steps.meta.outputs.version }}" \
            "${{ steps.meta.outputs.version_code }}" \
            "${{ github.repository }}" \
            "${{ steps.meta.outputs.version }}" \
            "${{ steps.meta.outputs.zip_name }}" \
            "${{ github.repository }}" > update.json
          if ! git diff --quiet update.json; then
            git add update.json
            git commit -m "chore: update update.json for ${{ steps.meta.outputs.version }} [skip ci]"
            git push origin main
          fi
