name: Build and Release Module

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read module metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME}"
          VERSION_CODE=$(grep '^versionCode=' module.prop | cut -d'=' -f2 | tr -d '\r')
          ZIP_NAME="OP15_165Hz_GLO_COS17_${VERSION}.zip"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build module ZIP
        run: |
          zip -r9 "${{ steps.meta.outputs.zip_name }}" . \
            -x ".git/*" ".github/*" "docs/*" ".gitignore" "README.md" "CHANGELOG.md" "update.json" "patched/*" "*.log" "*.zip"

      - name: Update update.json on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          cat << JSON > update.json
          {
            "version": "${{ steps.meta.outputs.version }}",
            "versionCode": ${{ steps.meta.outputs.version_code }},
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.version }}/${{ steps.meta.outputs.zip_name }}",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/CHANGELOG.md"
          }
          JSON
          if ! git diff --quiet update.json; then
            git add update.json
            git commit -m "chore: update update.json for ${{ steps.meta.outputs.version }} [skip ci]"
            git push origin main
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.version }}" "${{ steps.meta.outputs.zip_name }}" \
            --title "${{ steps.meta.outputs.version }} — OnePlus 15 GLO 165Hz Unlock" \
            --notes-file CHANGELOG.md
