name: Build and Release Module

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint shell scripts
        run: |
          sh -n customize.sh post-fs-data.sh service.sh uninstall.sh action.sh
          shellcheck post-fs-data.sh service.sh uninstall.sh action.sh
          shellcheck -s sh -e SC2154,SC2034 customize.sh

      - name: Test XML patcher logic
        run: |
          mkdir -p /tmp/xmltest
          cat << 'XML' > /tmp/xmltest/rr.xml
          <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
          <refresh_rate_config version="20260922">
            <extremeHighRate package="com.whatsapp" rateId="7" />
            <config defaultRateId="1-1-2-3" disableViewOverrideDefault="false" enableAppSwitchBoost="true" maxrefreshsettings="3" extremeHighEnable="true" />
            <item package="com.example.app" rateId="1-1-2-3" />
            <item package="com.example.camera" rateId="1-1-2-1" />
          </refresh_rate_config>
          XML
          cat << 'XML' > /tmp/xmltest/df.xml
          <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
          <dynamic_frame>
            <item type="20201" enable="true" targetFramerate="120" />
          </dynamic_frame>
          XML
          sed -i \
            -e '/^[[:space:]]*<config / s/defaultRateId="[0-9]-[0-9]-[0-9]-[0-9]"/defaultRateId="7-1-2-7"/' \
            -e '/^[[:space:]]*<config / s/enableAppSwitchBoost="true"/enableAppSwitchBoost="false"/' \
            -e '/^[[:space:]]*<config / s/maxrefreshsettings="[0-9]"/maxrefreshsettings="7"/' \
            -e '/^[[:space:]]*<config / s/disableViewOverrideDefault="false"/disableViewOverrideDefault="true"/' \
            -e '/[Cc]amera/! s/rateId="[0-9]-[0-9]-[0-9]-[0-9]"/rateId="7-1-2-7"/g' \
            -e '/^[[:space:]]*<config / s/<config /<config defaultMaxRate="165" /' \
            /tmp/xmltest/rr.xml
          sed -i -e 's/targetFramerate="120"/targetFramerate="165"/g' /tmp/xmltest/df.xml
          xmllint --noout /tmp/xmltest/rr.xml /tmp/xmltest/df.xml
          grep -q 'package="com.example.camera" rateId="1-1-2-1"' /tmp/xmltest/rr.xml
          ! grep -q 'targetFramerate="120"' /tmp/xmltest/df.xml

      - name: Read and validate module metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          PROP_VER=$(grep '^version=' module.prop | cut -d'=' -f2 | tr -d '\r')
          VERSION_CODE=$(grep '^versionCode=' module.prop | cut -d'=' -f2 | tr -d '\r')
          if [ "$TAG" != "$PROP_VER" ]; then
            echo "ERROR: Tag ($TAG) does not match module.prop version ($PROP_VER)"
            exit 1
          fi
          ZIP_NAME="OP15_165Hz_GLO_COS17_${TAG}.zip"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes for current version
        run: |
          awk -v ver="## ${{ steps.meta.outputs.version }}" '
            { sub(/\r$/, "") }
            $0 == ver { flag=1; next }
            /^## / && flag { exit }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          if ! grep -q "[^[:space:]]" release_notes.md; then
            echo "ERROR: Section ## ${{ steps.meta.outputs.version }} not found or empty in CHANGELOG.md"
            exit 1
          fi

      - name: Build module ZIP and SHA-256
        run: |
          ZIP="${{ steps.meta.outputs.zip_name }}"
          zip -r9 "$ZIP" . \
            -x ".git/*" ".github/*" "docs/*" ".gitignore" "README.md" "CHANGELOG.md" "update.json" "release_notes.md" "patched/*" "orig_settings.env" "*.log" "*.old" "*.zip" "*.sha256"
          sha256sum "$ZIP" > "${ZIP}.sha256"
          printf '\n### SHA-256\n\n    %s\n' "$(cat "${ZIP}.sha256")" >> release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP="${{ steps.meta.outputs.zip_name }}"
          gh release create "${{ steps.meta.outputs.version }}" "$ZIP" "${ZIP}.sha256" \
            --title "${{ steps.meta.outputs.version }} — OnePlus 15 GLO 165Hz Unlock" \
            --notes-file release_notes.md

      - name: Update update.json on main
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          ZIP_NAME: ${{ steps.meta.outputs.zip_name }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          python3 -c '
          import json, os
          p = "https:"
          ver = os.environ["VERSION"]
          code = int(os.environ["VERSION_CODE"])
          zip_name = os.environ["ZIP_NAME"]
          repo = os.environ["REPO"]
          data = {
              "version": ver,
              "versionCode": code,
              "zipUrl": f"{p}//github.com/{repo}/releases/download/{ver}/{zip_name}",
              "changelog": f"{p}//raw.githubusercontent.com/{repo}/main/CHANGELOG.md"
          }
          assert "[" not in data["zipUrl"] and data["zipUrl"].endswith(".zip")
          assert "[" not in data["changelog"] and data["changelog"].endswith("CHANGELOG.md")
          with open("update.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          '
          python3 -m json.tool update.json >/dev/null
          if ! git diff --quiet update.json; then
            git add update.json
            git commit -m "chore: update update.json for $VERSION [skip ci]"
            git push origin main
          fi
